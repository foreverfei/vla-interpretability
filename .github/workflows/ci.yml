name: ci

on:
  push:
    branches:
      - main
      - group-a
      - group-b
      - "group-a/**"
      - "group-b/**"
      - "infra/**"
      - "docs/**"
  pull_request:
    branches: [main, group-a, group-b]

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate repository protocol
        run: python tools/validate_repository.py
      - name: Run tests
        run: pytest -q
